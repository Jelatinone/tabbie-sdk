name: Check

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # Unsigned dry run: builds the full artifact set and POM into build/staging-repo without uploading.
      - run: ./gradlew check publishAllPublicationsToStagingRepository
